name: link-check

# Fails when an internal link or anchor on the site points nowhere.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check internal links and anchors
        run: python3 .github/scripts/check_links.py
